        </p>
<!-- Email Display Box -->
<div class="bg-surface-container-low border border-outline-variant rounded-lg p-stack-md w-full mb-stack-lg flex items-center justify-center gap-2">

</div>

            Please click the link in the email to confirm your identity and access Academica Exchange.
        </p>
<!-- Actions -->
<div class="w-full flex flex-col gap-stack-sm">
<button class="w-full bg-primary text-on-primary hover:bg-primary-container font-label-md text-label-md py-3 px-6 rounded-lg transition-colors duration-200 shadow-sm flex justify-center items-center gap-2">
<span class="material-symbols-outlined">open_in_new</span>
                Open Email App
            </button>
<!-- Resend Section with Timer -->
<div class="mt-stack-sm text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant mb-2">Didn't receive the email?</p>
<button class="text-primary hover:text-primary-container font-label-md text-label-md transition-colors disabled:text-outline disabled:cursor-not-allowed flex items-center justify-center gap-1 mx-auto" id="resendBtn" disabled="">
<span class="material-symbols-outlined text-[16px]">refresh</span>
                    Resend link in <span id="timerText" class="">0:52</span>
</button>
</div>
</div>
<!-- Support Link -->

</main>
<!-- Micro-interaction Script for Timer -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const resendBtn = document.getElementById('resendBtn');
            const timerText = document.getElementById('timerText');
            let timeLeft = 59;

            const countdown = setInterval(() => {
                timeLeft--;
                const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
                timerText.textContent = `0:${seconds}`;

                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    resendBtn.removeAttribute('disabled');
                    resendBtn.innerHTML = '<span class="material-symbols-outlined text-[16px]">refresh</span> Resend Verification Link';
                    resendBtn.classList.add('cursor-pointer');
                }
            }, 1000);

            resendBtn.addEventListener('click', function() {
                if (!this.hasAttribute('disabled')) {
                    // Simulate resend action
                    this.setAttribute('disabled', 'true');
                    timeLeft = 59;
                    this.innerHTML = '<span class="material-symbols-outlined text-[16px]">refresh</span> Resend link in <span id="timerText">0:59</span>';
                    
                    // Restart timer logic (simplified for demo)
                    const newTimerText = document.getElementById('timerText');
                    const newCountdown = setInterval(() => {
                        timeLeft--;
                        const seconds = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
                        if(newTimerText) newTimerText.textContent = `0:${seconds}`;

                        if (timeLeft <= 0) {
                            clearInterval(newCountdown);
                            this.removeAttribute('disabled');
                            this.innerHTML = '<span class="material-symbols-outlined text-[16px]">refresh</span> Resend Verification Link';
                        }
                    }, 1000);
                }
            });
        });
    </script>
